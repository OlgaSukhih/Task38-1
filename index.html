arks is ineffective.", "People who relax in parks never do sports.", "Relaxation seems to be a more common main reason for park visits than exercise."], "correct": 2, "feedback": "The correct comment stays close to the figures, describes the size of the difference accurately and avoids unsupported claims."}, {"topic": "Living in a big city", "comparison": "39% appreciate job opportunities, compared with 26% who value entertainment options.", "options": ["Employment prospects appear to be a stronger attraction than entertainment for these residents.", "Everyone living in a big city has a good job.", "Small towns offer no entertainment."], "correct": 0, "feedback": "The correct comment stays close to the figures, describes the size of the difference accurately and avoids unsupported claims."}, {"topic": "Moving to another city", "comparison": "36% would move for better work, while 29% would move for education.", "options": ["Education is unimportant for adults.", "Work and study are both important potential reasons for relocation, with employment slightly ahead.", "Everyone who moves finds a better job."], "correct": 1, "feedback": "The correct comment stays close to the figures, describes the size of the difference accurately and avoids unsupported claims."}, {"topic": "Housing preferences", "comparison": "43% prioritise a convenient location, whereas 18% focus on the size of the home.", "options": ["Small homes are always more comfortable.", "Everyone prefers to live in the city centre.", "Location is much more frequently chosen as the main priority than floor space."], "correct": 2, "feedback": "The correct comment stays close to the figures, describes the size of the difference accurately and avoids unsupported claims."}, {"topic": "Shopping habits", "comparison": "38% buy online to save time, compared with 32% who do so for lower prices.", "options": ["The narrow difference suggests that convenience and cost both play important roles.", "Online prices are always bes the size of the difference accurately and avoids unsupported claims."}, {"topic": "Family leisure", "comparison": "36% prefer outdoor activities with family, compared with 30% who choose watching films together.", "options": ["Families who watch films never exercise.", "Outdoor activities always strengthen family relationships.", "The relatively small gap suggests that both active and home-based leisure appeal to families."], "correct": 2, "feedback": "The correct comment stays close to the figures, describes the size of the difference accurately and avoids unsupported claims."}, {"topic": "Helping elderly people", "comparison": "41% help older relatives with shopping, whereas 24% assist with technology.", "options": ["Practical everyday assistance is reported more often than technical help.", "Older people cannot learn to use smartphones.", "Everyone who helps with shopping lives with their relatives."], "correct": 0, "feedback": "The correct comment stays close to the figures, describes the size of the difference accurately and avoids unsupported claims."}, {"topic": "Learning about science", "comparison": "44% prefer science videos, compared with 25% who prefer popular-science books.", "options": ["Books are no longer useful for learning science.", "Video content appears to be a more popular way of exploring science than books.", "Everyone who watches science videos understands the content."], "correct": 1, "feedback": "The correct comment stays close to the figures, describes the size of the difference accurately and avoids unsupported claims."}, {"topic": "Choosing a school club", "comparison": "39% choose clubs to develop skills, while 27% join to make friends.", "options": ["School clubs guarantee career success.", "Students who join clubs to make friends learn nothing.", "Skill development is a more common main reason for joining clubs than meeting people."], "correct": 2, "feedback": "The correct comment stays close to the figures, describes the size of the difference accurately and avoids unsupported claims."}];let current=0;const selections=Array(50).fill(null),checked=Array(50).fill(false);const $=id=>document.getElementById(id);const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function render(){const d=items[current];$('slide').innerHTML=`<div class="eyebrow">${String(current+1).padStart(2,'0')} · BUILD A COMMENT · EGE TASK 38</div><h1>Choose a convincing explanation</h1><p class="comparison"><strong>Topic:</strong> ${esc(d.topic)}<br><strong>Comparison:</strong> ${esc(d.comparison)}</p><div class="panel"><div id="choices">${d.options.map((o,j)=>`<label class="choice ${checked[current]?(j===d.correct?'right':selections[current]===j?'wrong':''):''}"><input type="radio" name="answer" value="${j}" ${selections[current]===j?'checked':''} ${checked[current]?'disabled':''}><span>${esc(o)}</span></label>`).join('')}</div><div class="actions"><button id="check">${checked[current]?'Try again':'Check'}</button><div class="feedback ${checked[current]?(selections[current]===d.correct?'good':'bad'):''}" id="feedback">${checked[current]?(selections[current]===d.correct?'Correct. ':'Not quite. ')+esc(d.feedback):''}</div></div></div><p class="hint">One answer is supported by the comparison. The other two make unjustified assumptions.</p>`;
